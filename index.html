<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fort Wayne / Allen County Intel</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&family=Barlow+Condensed:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--surface3:#1e1e28;--border:#2a2a3a;--border2:#32324a;--accent:#f5a623;--accent2:#e85d4a;--accent3:#4af5a6;--accent4:#5d8ef5;--text:#e8e8f0;--muted:#6b6b8a;--muted2:#9090b0;--hot:#ff4444;--warm:#ff8c00;--cool:#44aaff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden;}

.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--accent3);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.brand-name{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
.brand-sub{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;}
.updated{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);}

.statsbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;}
.statsbar::-webkit-scrollbar{display:none;}
.stat{display:flex;flex-direction:column;align-items:center;min-width:72px;}
.stat-num{font-size:20px;font-weight:800;line-height:1;}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;white-space:nowrap;}
.stat-num.hot{color:var(--hot);}.stat-num.warm{color:var(--warm);}.stat-num.cool{color:var(--cool);}.stat-num.green{color:var(--accent3);}.stat-num.gold{color:var(--accent);}
.sdiv{width:1px;background:var(--border);align-self:stretch;margin:0 2px;}

.tabs-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.tabs-wrap::-webkit-scrollbar{height:3px;}
.tabs-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.tabs{display:flex;gap:2px;white-space:nowrap;min-width:max-content;}
.tab{padding:12px 14px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}
.tab .badge{display:inline-flex;align-items:center;justify-content:center;background:var(--border);color:var(--muted);border-radius:10px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:5px;min-width:18px;}
.tab.active .badge{background:var(--accent);color:#000;}
.tab.urgent{color:var(--hot);}
.tab.urgent .badge{background:var(--hot);color:#fff;}

.toolbar{padding:10px 24px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border);background:var(--bg);flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:180px;}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 10px 7px 32px;font-family:'Space Mono',monospace;font-size:12px;color:var(--text);outline:none;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap input::placeholder{color:var(--muted);}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}
select{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:'Space Mono',monospace;font-size:11px;color:var(--text);outline:none;cursor:pointer;}
select:focus{border-color:var(--accent);}
.btn{padding:7px 14px;border-radius:6px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;cursor:pointer;border:none;letter-spacing:.05em;transition:all .15s;}
.btn-primary{background:var(--accent);color:#000;}
.btn-primary:hover{background:#f0b040;}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.rec-count{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap;}

.table-wrap{overflow:auto;height:calc(100vh - 214px);}
table{width:100%;border-collapse:collapse;}
thead th{background:var(--surface);padding:9px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:10;cursor:pointer;user-select:none;}
thead th:hover{color:var(--text);}
thead th.sorted{color:var(--accent);}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer;}
tbody tr:hover{background:var(--surface);}
tbody td{padding:9px 14px;font-size:13px;vertical-align:middle;}
.score-badge{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;font-family:'Space Mono',monospace;}
.sh{background:rgba(255,68,68,.15);color:var(--hot);border:1px solid rgba(255,68,68,.3);}
.sm{background:rgba(255,140,0,.15);color:var(--warm);border:1px solid rgba(255,140,0,.3);}
.sl{background:rgba(74,245,166,.15);color:var(--accent3);border:1px solid rgba(74,245,166,.3);}
.owner-name{font-weight:700;font-size:13px;margin-bottom:2px;}
.owner-sub{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;}
.amount-cell{font-family:'Space Mono',monospace;font-weight:700;color:var(--accent);}
.date-cell{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);}
.tags{display:flex;flex-wrap:wrap;gap:3px;}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.04em;white-space:nowrap;}
.t-hot{background:rgba(255,68,68,.2);color:#ff7777;border:1px solid rgba(255,68,68,.3);}
.t-warn{background:rgba(255,140,0,.2);color:#ffa040;border:1px solid rgba(255,140,0,.3);}
.t-blue{background:rgba(93,142,245,.2);color:#8ab4ff;border:1px solid rgba(93,142,245,.3);}
.t-green{background:rgba(74,245,166,.2);color:#50e8a0;border:1px solid rgba(74,245,166,.3);}
.t-purple{background:rgba(180,80,255,.2);color:#c080ff;border:1px solid rgba(180,80,255,.3);}
.t-gray{background:rgba(107,107,138,.2);color:#9090b0;border:1px solid rgba(107,107,138,.3);}
.t-gold{background:rgba(245,166,35,.2);color:#f5c060;border:1px solid rgba(245,166,35,.3);}
.view-btn{font-size:10px;font-weight:700;padding:4px 9px;border-radius:4px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer;text-decoration:none;display:inline-block;transition:all .15s;letter-spacing:.04em;}
.view-btn:hover{border-color:var(--accent);color:var(--accent);}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--muted);gap:8px;}
.loading{text-align:center;padding:36px;color:var(--muted);font-family:'Space Mono',monospace;font-size:12px;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.mo.open{display:flex;}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:780px;max-height:92vh;overflow-y:auto;padding:26px;}
.mh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
.mt{font-size:17px;font-weight:800;}
.ms{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;margin-top:3px;}
.mx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0;}
.mx:hover{color:var(--text);}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.mf{display:flex;flex-direction:column;gap:3px;}
.mf.full{grid-column:1/-1;}
.ml{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.mv{font-size:13px;color:var(--text);font-family:'Space Mono',monospace;}
.mv.hi{color:var(--accent);font-weight:700;}
.mv.gr{color:var(--accent3);}
.mv.rd{color:var(--accent2);}
.mdiv{grid-column:1/-1;border:none;border-top:1px solid var(--border);margin:2px 0;}
.msec{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:2px;}
.mtags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;}
.mact{grid-column:1/-1;display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}

/* DEAL ANALYZER in modal */
.da-wrap{grid-column:1/-1;background:var(--surface2);border:1px solid var(--accent);border-radius:10px;padding:18px;margin-top:2px;}
.da-title{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:14px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;}
.da-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.da-field{display:flex;flex-direction:column;gap:4px;}
.da-field.full{grid-column:1/-1;}
.da-field label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.da-field input,.da-field select{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:'Space Mono',monospace;font-size:12px;color:var(--text);outline:none;width:100%;}
.da-field input:focus{border-color:var(--accent);}
.slider-row{display:flex;align-items:center;gap:10px;}
.slider-row input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer;}
.slider-val{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--accent);min-width:42px;text-align:right;}
.cond-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.cond-btn{padding:5px 12px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted);transition:all .15s;font-family:'Barlow Condensed',sans-serif;letter-spacing:.04em;}
.cond-btn.active{background:var(--accent);color:#000;border-color:var(--accent);}
.rtable{width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.rtable th{background:var(--bg);padding:7px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);}
.rtable td{padding:7px 10px;font-size:11px;font-family:'Space Mono',monospace;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.rtable tr:last-child td{border-bottom:none;}
.rtable tr:hover td{background:var(--surface);}
.rtable tr.sel td{background:rgba(245,166,35,.1);color:var(--accent);font-weight:700;}
.rtable td:first-child{color:var(--muted);}
.da-result{grid-column:1/-1;border-radius:8px;padding:18px;text-align:center;border:2px solid var(--border);transition:all .25s;margin-top:4px;}
.da-result.green{background:rgba(74,245,166,.07);border-color:rgba(74,245,166,.35);}
.da-result.yellow{background:rgba(245,166,35,.07);border-color:rgba(245,166,35,.35);}
.da-result.red{background:rgba(232,93,74,.07);border-color:rgba(232,93,74,.35);}
.mao-lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.mao-num{font-size:36px;font-weight:800;font-family:'Space Mono',monospace;line-height:1;}
.mao-bd{font-size:11px;font-family:'Space Mono',monospace;color:var(--muted);margin-top:10px;line-height:1.8;}
.mao-verdict{font-size:13px;font-weight:700;margin-top:8px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.04em;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}

@media(max-width:768px){
  .mg,.da-grid{grid-template-columns:1fr;}
  .mf.full,.da-field.full,.da-result{grid-column:1;}
  .statsbar{gap:14px;}.stat-num{font-size:16px;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-dot"></div>
    <div>
      <div class="brand-name">Fort Wayne / Allen County Intel</div>
      <div class="brand-sub">Motivated seller dashboard</div>
    </div>
  </div>
  <div class="updated" id="updated">Loading...</div>
</header>

<div class="statsbar">
  <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-label">Records</div></div>
  <div class="sdiv"></div>
  <div class="stat"><div class="stat-num hot" id="s-hot">0</div><div class="stat-label">Hot Stack</div></div>
  <div class="sdiv"></div>
  <div class="stat"><div class="stat-num warm" id="s-foreclosure">0</div><div class="stat-label">Foreclosure</div></div>
  <div class="sdiv"></div>
  <div class="stat"><div class="stat-num cool" id="s-code">0</div><div class="stat-label">Code / Nuisance</div></div>
  <div class="sdiv"></div>
  <div class="stat"><div class="stat-num green" id="s-absentee">0</div><div class="stat-label">Absentee</div></div>
  <div class="sdiv"></div>
  <div class="stat"><div class="stat-num gold" id="s-tax">0</div><div class="stat-label">Tax Delinquent</div></div>
  <div class="sdiv"></div>
  <div class="stat"><div class="stat-num cool" id="s-probate">0</div><div class="stat-label">Probate</div></div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="all">All Leads <span class="badge" id="b-all">0</span></button>
    <button class="tab urgent" data-tab="hot_stack">Hot Stack <span class="badge" id="b-hot_stack">0</span></button>
    <button class="tab" data-tab="foreclosure">Foreclosure <span class="badge" id="b-foreclosure">0</span></button>
    <button class="tab" data-tab="tax_delinquent">Tax Delinquent <span class="badge" id="b-tax_delinquent">0</span></button>
    <button class="tab" data-tab="code_violation">Code / Nuisance <span class="badge" id="b-code_violation">0</span></button>
    <button class="tab" data-tab="probate">Probate <span class="badge" id="b-probate">0</span></button>
    <button class="tab" data-tab="absentee">Absentee <span class="badge" id="b-absentee">0</span></button>
  </div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <span class="si">&#8981;</span>
    <input type="text" id="q" placeholder="Search owner, address, parcel, tags..." oninput="applyFilters()">
  </div>
  <select id="score-filter" onchange="applyFilters()">
    <option value="">Score: All</option>
    <option value="80">Score 80+</option>
    <option value="60">Score 60+</option>
  </select>
  <button class="btn btn-primary" onclick="exportCSV()">CSV</button>
  <button class="btn btn-ghost" onclick="clearFilters()">Clear</button>
  <div class="rec-count" id="rec-count">0 records</div>
</div>

<div class="table-wrap">
  <table>
    <thead><tr>
      <th onclick="sortBy('score',this)">Score</th>
      <th onclick="sortBy('owner_name',this)">Owner / Property</th>
      <th onclick="sortBy('lead_type',this)">Lead Type</th>
      <th onclick="sortBy('filed_date',this)">Filed</th>
      <th onclick="sortBy('amount',this)">Amount</th>
      <th>Signals</th>
      <th>Source</th>
    </tr></thead>
    <tbody id="tbody">
      <tr><td colspan="7"><div class="loading"><span class="spinner"></span>Loading Fort Wayne leads...</div></td></tr>
    </tbody>
  </table>
</div>

<!-- MODAL -->
<div class="mo" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mc" id="mc"></div>
</div>

<script>
/* ── DATA ─────────────────────────────────────────────────────── */
let records=[], filtered=[], curTab='all', sortCol='score', sortDir=-1;
const PAGE=200;
let rendered=0;

const money=v=>v==null||v===''?'–':'$'+Number(v).toLocaleString();
const clean=v=>String(v||'').trim();

const hasSignal=(r,s)=>[...(r.distress_sources||[]),...(r.tags||[])].some(x=>x===s||x.includes(s))||r.lead_type_key===s;
const inTab=r=>{
  if(curTab==='all')return true;
  if(curTab==='hot_stack')return !!r.hot_stack;
  return hasSignal(r,curTab);
};

/* ── LOAD ─────────────────────────────────────────────────────── */
async function loadRecords(){
  try{
    const res=await fetch('data/records.json',{cache:'no-store'});
    const data=await res.json();
    records=(data.records||[]);
    document.getElementById('updated').textContent=`Last updated: ${data.fetched_at||'local'}`;
    updateStats();
    applyFilters();
  }catch(err){
    document.getElementById('tbody').innerHTML=`<tr><td colspan="7"><div class="empty">Could not load data/records.json: ${err.message}</div></td></tr>`;
    document.getElementById('updated').textContent='Offline';
  }
}

/* ── STATS ─────────────────────────────────────────────────────── */
function updateStats(){
  const c=fn=>records.filter(fn).length;
  document.getElementById('s-total').textContent=records.length;
  document.getElementById('s-hot').textContent=c(r=>r.hot_stack);
  document.getElementById('s-foreclosure').textContent=c(r=>hasSignal(r,'foreclosure'));
  document.getElementById('s-code').textContent=c(r=>hasSignal(r,'code_violation'));
  document.getElementById('s-absentee').textContent=c(r=>hasSignal(r,'absentee'));
  document.getElementById('s-tax').textContent=c(r=>hasSignal(r,'tax_delinquent'));
  document.getElementById('s-probate').textContent=c(r=>hasSignal(r,'probate'));
  ['all','hot_stack','foreclosure','tax_delinquent','code_violation','probate','absentee'].forEach(tab=>{
    const b=document.getElementById('b-'+tab);
    if(b)b.textContent=records.filter(r=>tab==='all'||(tab==='hot_stack'?r.hot_stack:hasSignal(r,tab))).length;
  });
}

/* ── TAG STYLING ──────────────────────────────────────────────── */
function tagClass(t){
  const n=String(t||'').toLowerCase().replace(/_/g,'-');
  if(n.includes('hot-stack')||n==='hot')return 't-hot';
  if(n.includes('foreclosure')||n.includes('sheriff'))return 't-hot';
  if(n.includes('tax-delinq')||n.includes('tax_delinq'))return 't-warn';
  if(n.includes('probate'))return 't-purple';
  if(n.includes('code')||n.includes('nuisance')||n.includes('housing'))return 't-gold';
  if(n.includes('absentee'))return 't-blue';
  if(n.includes('out-of-state')||n.includes('out_of_state'))return 't-blue';
  if(n.includes('institutional')||n.includes('bank')||n.includes('hud')||n.includes('lender'))return 't-gray';
  if(n.includes('property-record-matched')||n.includes('property_record'))return 't-green';
  return 't-gray';
}
const tagHTML=r=>(r.tags||[]).map(t=>`<span class="tag ${tagClass(t)}">${t}</span>`).join('');

/* ── FILTER + SORT ────────────────────────────────────────────── */
function applyFilters(){
  const q=clean(document.getElementById('q').value).toLowerCase();
  const minScore=Number(document.getElementById('score-filter').value)||0;
  filtered=records.filter(r=>inTab(r)&&(Number(r.score)||0)>=minScore).filter(r=>{
    if(!q)return true;
    const hay=[r.owner_name,r.property_address,r.property_city,r.parcel_id,r.lead_type,...(r.tags||[]),...(r.distress_sources||[])].join(' ').toLowerCase();
    return hay.includes(q);
  });
  doSort();rendered=0;renderTable();
  document.getElementById('rec-count').textContent=filtered.length.toLocaleString()+' records';
}
function sortBy(col,th){
  sortDir=sortCol===col?-sortDir:-1;sortCol=col;
  document.querySelectorAll('thead th').forEach(x=>x.classList.remove('sorted'));
  if(th)th.classList.add('sorted');
  doSort();rendered=0;renderTable();
}
function doSort(){
  filtered.sort((a,b)=>{
    let av=a[sortCol],bv=b[sortCol];
    if(av==null)av=sortDir<0?-Infinity:Infinity;
    if(bv==null)bv=sortDir<0?-Infinity:Infinity;
    if(typeof av==='string')return av.localeCompare(bv)*sortDir;
    return(av-bv)*sortDir;
  });
}
function clearFilters(){
  document.getElementById('q').value='';
  document.getElementById('score-filter').value='';
  applyFilters();
}

/* ── TABLE RENDER ─────────────────────────────────────────────── */
const _rowStore=[];
function renderTable(){
  _rowStore.length=0;
  const tbody=document.getElementById('tbody');
  if(!filtered.length){
    tbody.innerHTML='<tr><td colspan="7"><div class="empty">No matching leads found.</div></td></tr>';
    return;
  }
  tbody.innerHTML=filtered.slice(0,PAGE).map(rowHTML).join('');
  rendered=Math.min(PAGE,filtered.length);
  if(filtered.length>PAGE){
    const s=document.createElement('tr');s.id='sentinel';
    s.innerHTML='<td colspan="7"><div class="loading" style="padding:14px">Scroll for more...</div></td>';
    tbody.appendChild(s);observe();
  }
}
function observe(){
  const s=document.getElementById('sentinel');if(!s)return;
  new IntersectionObserver(e=>{if(e[0].isIntersecting)loadMore();},{root:document.querySelector('.table-wrap'),threshold:.1}).observe(s);
}
function loadMore(){
  const tbody=document.getElementById('tbody');
  const s=document.getElementById('sentinel');if(s)s.remove();
  filtered.slice(rendered,rendered+PAGE).forEach(r=>tbody.insertAdjacentHTML('beforeend',rowHTML(r)));
  rendered+=PAGE;
  if(rendered<filtered.length){
    const s=document.createElement('tr');s.id='sentinel';
    s.innerHTML='<td colspan="7"><div class="loading" style="padding:14px">Loading more...</div></td>';
    tbody.appendChild(s);observe();
  }
}

const ZIP_HOOD_FW={
  '46801':'downtown','46802':'downtown','46803':'east state',
  '46804':'aboite',  '46805':'northside','46806':'southeast',
  '46807':'waynedale','46808':'northwest','46809':'waynedale',
  '46814':'aboite',  '46815':'northeast fort wayne','46816':'southeast',
  '46818':'northwest','46819':'southeast','46825':'dupont',
  '46835':'dupont',  '46845':'homestead',
};

const TIER_LABELS={A:'Premium',B:'Solid',C:'Working Class',D:'Deep Discount'};
const TIER_COLORS={A:'var(--accent3)',B:'var(--accent)',C:'var(--warm)',D:'var(--hot)'};
const TIER_COMPS={
  A:'Comp streets: Covington Rd, Illinois Rd, Aboite Center Rd',
  B:'Comp streets: Lima Rd, Clinton St N, Coldwater Rd',
  C:'Comp streets: Coliseum Blvd, Anthony Blvd, State Blvd',
  D:'Comp streets: Calhoun St, Broadway, Pontiac St',
};

function detectHoodFW(r){
  const addr=(r.property_address||'').toLowerCase();
  const city=(r.property_city||'').toLowerCase();
  let zip=(r.property_zip||'').replace(/\D/g,'').slice(0,5);

  const clues=[
    ['aboite','aboite'],['covington','covington'],['homestead','homestead'],
    ['waynedale','waynedale'],['georgetown','georgetown'],['illinois road','illinois road'],
    ['dupont','dupont'],['northside','northside'],['downtown','downtown'],
    ['old fort','old fort wayne'],['state blvd','east state'],['east state','east state'],
    ['broadway','downtown'],['calhoun','downtown'],['pontiac','downtown'],
    ['coliseum','northside'],['anthony blvd','northeast fort wayne'],
    ['lima rd','northwest'],['coldwater','northwest'],['clinton','northwest'],
  ];

  for(const[kw,hood]of clues){
    if(addr.includes(kw)||city.includes(kw))return{hood,source:'keyword',confidence:'high'};
  }
  if(zip&&ZIP_HOOD_FW[zip])return{hood:ZIP_HOOD_FW[zip],source:'zip',confidence:'medium'};

  // extract ZIP from address string
  const m=(r.property_address||'').match(/\b(468\d{2})\b/);
  if(m&&ZIP_HOOD_FW[m[1]])return{hood:ZIP_HOOD_FW[m[1]],source:'zip-extracted',confidence:'medium'};

  return{hood:'fort wayne',source:'default',confidence:'low'};
}

function conditionMultiplierFW(r){
  const dt=(r.lead_type||r.lead_type_key||'').toLowerCase();
  const tags=(r.tags||[]).join(' ').toLowerCase();
  if(tags.includes('fire'))return 0.50;
  if(dt.includes('code')||tags.includes('code'))return 0.65;
  if(tags.includes('vacant'))return 0.68;
  if(dt.includes('foreclosure')||dt.includes('sheriff'))return 0.70;
  if(dt.includes('probate'))return 0.75;
  if(dt.includes('tax'))return 0.78;
  return 0.80;
}

function distressPenaltyFW(r){
  const dt=(r.lead_type||r.lead_type_key||'').toLowerCase();
  const tags=(r.tags||[]).join(' ').toLowerCase();
  let d=0,reasons=[];
  if(dt.includes('foreclosure')||tags.includes('foreclosure')){d+=28;reasons.push('foreclosure');}
  if(dt.includes('sheriff')||tags.includes('sheriff')){d+=30;reasons.push('sheriff sale');}
  if(dt.includes('probate')||tags.includes('probate')){d+=18;reasons.push('probate estate');}
  if(dt.includes('tax')||tags.includes('tax-delinq')){d+=15;reasons.push('tax delinquent');}
  if(tags.includes('code')||tags.includes('nuisance')){d+=12;reasons.push('code violation');}
  if(tags.includes('vacant')){d+=5;reasons.push('vacant');}
  if(tags.includes('absentee')||tags.includes('out-of-state')){d+=4;reasons.push('absentee');}
  if(tags.includes('bank-owned')||tags.includes('hud-owned')){d+=8;reasons.push('bank/HUD owned');}
  if((r.distress_sources||[]).length>=3){d+=5;reasons.push('3+ distress signals');}
  if(r.hot_stack){d+=4;reasons.push('hot stack');}
  return{pct:Math.min(d,50),reasons};
}

function localValuationFW(r){
  const hoodData=detectHoodFW(r);
  const hood=hoodData.hood;
  const hd=FW_HOODS[hood]||FW_HOODS['fort wayne'];
  const factors=[];
  const warnings=[];
  let dataSources=0;
  let dataQuality=0;

  // Assessed value
  let assessedMarket=null;
  if(r.assessed_value&&r.assessed_value>5000){
    // Indiana uses ~50% assessment ratio
    assessedMarket=Math.round(r.assessed_value/0.50);
    const ratio=assessedMarket/hd.compMid;
    if(ratio>=0.80&&ratio<=1.20){
      factors.push(`&#127963; Assessed $${Math.round(r.assessed_value).toLocaleString()} &divide; 0.50 = $${assessedMarket.toLocaleString()} market &mdash; aligns with tier`);
      dataQuality+=35;dataSources++;
    } else {
      factors.push(`&#127963; Assessed $${Math.round(r.assessed_value).toLocaleString()} &divide; 0.50 = $${assessedMarket.toLocaleString()} market`);
      dataQuality+=15;dataSources++;
    }
  } else if(r.estimated_equity&&r.estimated_equity>0){
    factors.push(`&#128200; Equity signal: $${Math.round(r.estimated_equity).toLocaleString()}`);
    dataQuality+=10;
  }

  factors.push(`&#128205; ${hood.replace(/\b\w/g,c=>c.toUpperCase())} (Tier ${hd.tier})`);
  factors.push(`&#128178; Tier ${hd.tier} range: $${Math.round(hd.compLow/1000)}k&ndash;$${Math.round(hd.compHigh/1000)}k`);
  factors.push(`&#128178; Price/sqft: $${hd.ppsf.low}&ndash;$${hd.ppsf.high}/sqft`);

  const arvRemodeled=Math.round(hd.compHigh*0.92);
  const arvLow=Math.round(hd.compLow*0.90);
  const arvHigh=Math.round(hd.compHigh);
  const arvSafe=Math.round(arvRemodeled*0.92);
  const condMult=conditionMultiplierFW(r);
  const arvAsIs=Math.round(arvRemodeled*condMult);
  const{pct:discPct,reasons:discReasons}=distressPenaltyFW(r);
  const distressedVal=Math.round(arvRemodeled*(1-discPct/100));

  if(discReasons.length)factors.push(`&#128251; ${discPct}% distress discount: ${discReasons.join(', ')}`);
  factors.push(`&#128273; ARV = fully renovated. As-Is &asymp; $${arvAsIs.toLocaleString()}`);
  factors.push(`&#9989; Conservative ARV (low side): $${arvSafe.toLocaleString()} &mdash; use for MAO`);

  if(hoodData.source==='default')warnings.push('&#9888;&#65039; Neighborhood not detected &mdash; using Fort Wayne average. Verify zip/address.');

  const confidence=dataQuality>=60?'high':dataQuality>=30?'medium':'low';

  const notes={
    A:{rule:'Premium SW corridor. Retail buyers compete. Even distressed properties move fast here.',warning:'Buyers expect quality finishes. Budget rehab accordingly &mdash; shortcuts hurt ARV.'},
    B:{rule:'Bread-and-butter rental &amp; flip market. Consistent buyer pool. Narrow spread.',warning:'Condition matters most &mdash; outdated vs remodeled can swing $30k+.'},
    C:{rule:'High-volume distress zone. Cash buyers only. Verify comps are not other distress sales.',warning:'Pull only 0&ndash;3 month solds. Market moves fast in this bracket.'},
    D:{rule:'Deep discount. Extended hold, thin buyer pool. Price aggressively and move fast.',warning:'If range is $40k&ndash;$65k, use $35k&ndash;$45k ARV. Low side always.'},
  };

  return{hood,tier:hd.tier,arvLow,arvHigh,arvRemodeled,arvSafe,arvAsIs,distressedVal,discPct,confidence,dataSources,factors,warnings,note:notes[hd.tier],hoodSource:hoodData.source};
}

function mSetMode(m){
  ['ws','fl','re'].forEach(k=>{
    const b=document.getElementById('mmode-'+k);if(!b)return;
    b.style.borderColor='var(--border)';b.style.background='none';b.style.color='var(--muted)';
  });
  const map={wholesale:'ws',flip:'fl',rental:'re'};
  const C={wholesale:['rgba(245,166,35,.4)','rgba(245,166,35,.1)','var(--accent)'],flip:['rgba(74,245,166,.4)','rgba(74,245,166,.1)','var(--accent3)'],rental:['rgba(93,142,245,.4)','rgba(93,142,245,.1)','var(--accent4)']};
  const b=document.getElementById('mmode-'+map[m]);
  if(b){const[bc,bg,col]=C[m];b.style.borderColor=bc;b.style.background=bg;b.style.color=col;}
  const pct={wholesale:70,flip:70,rental:80}[m];
  const ps=document.getElementById('da-pct'),pv=document.getElementById('da-pctv');
  if(ps)ps.value=pct;if(pv)pv.textContent=pct+'%';
  const fl=document.getElementById('da-fee');
  if(fl)fl.previousElementSibling.textContent=m==='wholesale'?'Wholesale Fee':m==='flip'?'Flip Profit Target':'Cash Flow Target';
  mCalc();
}
function mSetPct(v){const ps=document.getElementById('da-pct'),pv=document.getElementById('da-pctv');if(ps)ps.value=v;if(pv)pv.textContent=v+'%';mCalc();}
function mSetCond(c,btn){
  _mCond=c;
  document.querySelectorAll('.cond-btn').forEach(b=>{b.classList.remove('active');b.style.borderColor='';b.style.color='';});
  btn.classList.add('active');

  const rh=document.getElementById('da-rehab');if(rh)rh.value=M_SQFT[_mRow][c]+mCalcAddonTotal();
  mCalc();
}
function mSelRow(i){
  _mRow=i;

function mToggleAddon(id){
  _mAddons[id]=!_mAddons[id];
  const el=document.getElementById('mdai-'+id);
  const ck=document.getElementById('mdack-'+id);
  const cv=document.getElementById('mdacv-'+id);

  if(_mAddons[id]){
    if(el){el.style.borderColor='rgba(255,140,0,.4)';el.style.background='rgba(255,140,0,.07)';}
    if(ck){ck.textContent='&#10003;';ck.style.background='var(--warm)';ck.style.borderColor='var(--warm)';ck.style.color='#000';}
    if(cv){cv.textContent='+$'+(a.def/1000).toFixed(0)+'k';cv.style.color='var(--warm)';}
  }else{
    if(el){el.style.borderColor='';el.style.background='';}
    if(ck){ck.textContent='';ck.style.background='';ck.style.borderColor='var(--border2)';ck.style.color='';}

function mCalcAddonTotal(){return M_ADDONS.filter(a=>_mAddons[a.id]).reduce((s,a)=>s+a.def,0);}

function mSyncARVs(){
  const base=parseFloat(document.getElementById('da-arv')?.value)||0;
  if(!base)return;
  const low=document.getElementById('da-arv-low');
  const high=document.getElementById('da-arv-high');
  if(low&&!low.value)low.value=Math.round(base*0.94);
  if(high&&!high.value)high.value=Math.round(base*1.06);
}

function mCalc(){
  const arv=parseFloat(document.getElementById('da-arv')?.value)||0;
  const arvLow=parseFloat(document.getElementById('da-arv-low')?.value)||0;
  const arvHigh=parseFloat(document.getElementById('da-arv-high')?.value)||0;
  const pct=parseFloat(document.getElementById('da-pct')?.value)||70;
  const rehab=parseFloat(document.getElementById('da-rehab')?.value)||0;
  const fee=parseFloat(document.getElementById('da-fee')?.value)||10000;
  const closing=parseFloat(document.getElementById('da-closing')?.value)||3000;
  const other=parseFloat(document.getElementById('da-other')?.value)||0;
  const fmt=v=>v>=0?'$'+Math.round(v).toLocaleString():'-$'+Math.round(Math.abs(v)).toLocaleString();

  if(!arv){const m=document.getElementById('da-mao');if(m){m.textContent='Enter ARV';m.style.color='var(--muted)';}return;}

  const gross=arv*pct/100;
  const totalCosts=rehab+fee+closing+other;
  const mao=gross-totalCosts;
  const lowball=Math.max(0,Math.round(arv*(Math.max(50,pct-5)/100)-totalCosts));
  const target=Math.max(0,Math.round(mao));
  const maxMao=Math.max(0,Math.round(arv*(Math.min(90,pct+5)/100)-totalCosts));

  const mEl=document.getElementById('da-mao');if(mEl)mEl.textContent=fmt(mao);
  const rr=document.getElementById('da-range-row');
  if(rr){
    rr.style.display='flex';
    const ms=document.getElementById('da-mao-safe');if(ms)ms.textContent=fmt(lowball);
    const mt=document.getElementById('da-mao-target');if(mt)mt.textContent=fmt(target);
    const ma=document.getElementById('da-mao-aggr');if(ma)ma.textContent=fmt(maxMao);
  }

  const bdEl=document.getElementById('da-bd');
  if(bdEl)bdEl.innerHTML=[`ARV ${fmt(arv)}&times;${pct}%=${fmt(gross)}`,`&minus;Rehab ${fmt(rehab)}`,`&minus;Fee ${fmt(fee)}`,`&minus;Closing ${fmt(closing)}`,...(other?[`&minus;Other ${fmt(other)}`]:[])].join('&nbsp;&middot;&nbsp;');

  const res=document.getElementById('da-res');const vd=document.getElementById('da-vd');
  if(res)res.className='da-result';
  if(mao>=30000){if(res)res.classList.add('green');if(mEl)mEl.style.color='var(--accent3)';if(vd){vd.textContent='Strong deal — room to move';vd.style.color='var(--accent3)';}}
  else if(mao>=15000){if(res)res.classList.add('yellow');if(mEl)mEl.style.color='var(--accent)';if(vd){vd.textContent='Workable — negotiate hard';vd.style.color='var(--accent)';}}
  else if(mao>0){if(res)res.classList.add('yellow');if(mEl)mEl.style.color='var(--warm)';if(vd){vd.textContent='Tight — seller needs to drop';vd.style.color='var(--warm)';}}
  else{if(res)res.classList.add('red');if(mEl)mEl.style.color='var(--hot)';if(vd){vd.textContent="Doesn't pencil — walk away";vd.style.color='var(--hot)';}}
}

function exportCSV(){
  const headers=['owner_name','property_address','property_city','property_state','property_zip','mailing_address','mailing_city','mailing_state','mailing_zip','parcel_id','lead_type','score','amount','estimated_equity','filed_date','distress_sources','tags','notes','public_records_url'];
  const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const lines=filtered.map(r=>[r.owner_name,r.property_address,r.property_city,r.property_state,r.property_zip,r.mailing_address,r.mailing_city,r.mailing_state,r.mailing_zip,r.parcel_id,r.lead_type,r.score,r.amount,r.estimated_equity,r.filed_date,(r.distress_sources||[]).join(', '),(r.tags||[]).join(', '),r.notes,r.public_records_url].map(esc).join(','));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([[headers.map(esc).join(','),...lines].join('\n')],{type:'text/csv'}));
  a.download=`fort_wayne_allen_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  curTab=btn.dataset.tab;
  applyFilters();
});

/* ── BOOT ─────────────────────────────────────────────────────── */
loadRecords();
</script>
</body>
</html>
